apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-role
rules:
  # Network discovery — pod/service/node listing for topology, dashboards, diagnostics
  - apiGroups: [""]
    resources: [pods, services, nodes, endpoints, namespaces]
    verbs: [get, list, watch]
  # RBAC — cluster and namespace role binding audit
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, rolebindings, clusterroles, roles]
    verbs: [get, list]
  # Metrics — node/pod resource usage (only needed if metrics-server is installed)
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  # Storage — storage class, PVC, and PV discovery
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  # Kubernetes NetworkPolicy discovery
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list]
  # CNI (Calico) — IPAM, BGP, Felix, policies, host endpoints
  - apiGroups: ["crd.projectcalico.org"]
    resources:
      - ippools
      - ipamblocks
      - ipamconfigs
      - bgppeers
      - bgpconfigurations
      - felixconfigurations
      - networkpolicies
      - globalnetworkpolicies
      - hostendpoints
      - clusterinformations
    verbs: [get, list, watch]
  # Connectivity diagnostics — create/delete ephemeral busybox pods for connectivity tests
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
  # Connectivity diagnostics — read logs from test pods to capture results
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]

  # ════════════════════════════════════════════════════════════
  #  CLUSTER MANAGEMENT — WRITE OPERATIONS
  #  (the dashboard's Configure tab: cordon/uncordon, namespaces,
  #   services, configmaps, secrets, deployments, Calico CRDs)
  # ════════════════════════════════════════════════════════════

  # Nodes — cordon / uncordon (patch spec.unschedulable)
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]

  # Namespaces — create / delete
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, delete]

  # Services — create / patch / delete
  - apiGroups: [""]
    resources: [services]
    verbs: [create, patch, delete]

  # ConfigMaps — list / create / patch / delete
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, patch, delete]

  # Secrets — list / create / delete
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, delete]

  # Deployments — create / scale (patch /scale subresource) / restart / edit image
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ["apps"]
    resources: [deployments/scale]
    verbs: [get, patch, update]

  # Calico CRDs — IP pools and BGP peers (create / patch / delete)
  - apiGroups: ["crd.projectcalico.org"]
    resources: [ippools, bgppeers]
    verbs: [create, patch, delete]
