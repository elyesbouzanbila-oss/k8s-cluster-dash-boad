# Calico NetworkPolicy for the dashboard backend.
#
# Upgraded from networking.k8s.io/v1 to a Calico CRD (crd.projectcalico.org/v1,
# served by Tigera operator installs of Calico v3.27+ — the older
# projectcalico.org/v3 group is not served on those clusters) so the
# policy is visible to the dashboard's policy/coverage views (they only read
# Calico CRDs, which is why this workload showed as EXPOSED despite having a
# policy applied).
#
# Restricts INGRESS only. Egress is intentionally left open: the backend
# reaches Redis, kube-apiserver, Prometheus and the AI API — omitting Egress
# from `types` leaves all of those flows untouched.
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: dashboard-backend
spec:
  selector: app == 'dashboard-backend'
  types:
    - Ingress
  ingress:
    # Reverse proxy: frontend nginx forwards /api/* to the backend.
    - action: Allow
      protocol: TCP
      source:
        selector: app == 'dashboard-frontend'
      destination:
        ports:
          - 8000
    # Falco webhook ingestion: falcosidekick posts threat events to
    # /api/threats/falco. Allowed both direct to the backend service and via
    # the frontend nginx proxy (which forwards /api/* here anyway).
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: projectcalico.org/name == 'falco'
        selector: app == 'falcosidekick'
      destination:
        ports:
          - 8000
